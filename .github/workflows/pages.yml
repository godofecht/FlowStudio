name: Deploy documentation site
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == 'godofecht/FlowStudio')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact qualified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require qualified current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned browser compiler SDK
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: '5.0.0'
      - name: Build the current workbench for Pages
        run: |
          npm ci
          npm run build:pages
          npx playwright install --with-deps chromium
          npm run test:pages
      - name: Confirm the static site entry points exist
        run: |
          set -eu
          test -s build/pages/index.html
          test -s build/pages/app/index.html
          test -s build/pages/browser/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site serves the expected HTML
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages can take a short interval to publish a completed deployment.
          # A successful deploy-pages API call is not, by itself, public HTTP acceptance.
          site="https://godofecht.github.io/FlowStudio/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                "$site" --output /tmp/flowstudio-pages.html &&
               grep -Fq "content=\"$(git rev-parse HEAD)\"" /tmp/flowstudio-pages.html &&
               grep -Fq 'src="./ui/workbench.js?v=' /tmp/flowstudio-pages.html; then
              echo "Verified public FlowStudio workbench: $site"
              exit 0
            fi
            echo "Pages endpoint not ready (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::GitHub Pages deployed but the public FlowStudio HTML was not verified"
          exit 1
