name: Deploy documentation site
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == 'godofecht/FlowStudio')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact qualified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Confirm the static site entry points exist
        run: |
          set -eu
          test -s docs/index.html
          test -s docs/app/index.html
          test -s docs/app/mixed.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site serves the expected HTML
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages can take a short interval to publish a completed deployment.
          # A successful deploy-pages API call is not, by itself, public HTTP acceptance.
          site="https://godofecht.github.io/FlowStudio/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                "$site" --output /tmp/flowstudio-pages.html &&
               grep -Fq '<title>FlowStudio: Flow-first scientific IDE</title>' /tmp/flowstudio-pages.html; then
              echo "Verified public FlowStudio documentation: $site"
              exit 0
            fi
            echo "Pages endpoint not ready (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::GitHub Pages deployed but the public FlowStudio HTML was not verified"
          exit 1
