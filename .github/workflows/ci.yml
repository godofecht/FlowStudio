name: CI
on:
  push:
    branches: [main, feat/native-monaco-r-member-completion-20261026]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rebuild_monaco_pr89:
    name: Rebuild committed Monaco assets for PR 89
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 89) || github.ref == 'refs/heads/feat/native-monaco-r-member-completion-20261026'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-monaco-r-member-completion-20261026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild shipped Monaco assets with pinned dependencies
        run: |
          npm ci
          npm run build:ui
          node --test tests/ide_r_member_completion.test.js
      - name: Commit generated assets to source branch
        shell: bash
        run: |
          git add web/ui/workbench.js web/ui/editor.worker.js web/ui/THIRD_PARTY_LICENSES.txt
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(ui): regenerate shipped Monaco assets for R member completion'
            git push origin HEAD:refs/heads/feat/native-monaco-r-member-completion-20261026
          fi
  sync_pr89:
    name: Integrate main, rebuild Monaco and validate PR 89
    needs: rebuild_monaco_pr89
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/native-monaco-r-member-completion-20261026'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-monaco-r-member-completion-20261026
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main with explicit PR preference on overlapping hunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff -X ours origin/main -m 'merge: reconcile main into R member completion'
          git diff --check
      - name: Rebuild and run complete Node acceptance on integrated tree
        run: |
          npm ci
          npm run build:ui
          node --test tests/*.test.js
      - name: Commit verified generated assets and integrated branch
        run: |
          git add web/ui/workbench.js web/ui/editor.worker.js web/ui/THIRD_PARTY_LICENSES.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build(ui): regenerate Monaco after integration with main'
          fi
          git push origin HEAD:refs/heads/feat/native-monaco-r-member-completion-20261026
  quality:
    name: Source and transport / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript module, DOM and source contract suites
        run: node --test tests/*.test.js
      - name: Python syntax and verification harness
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Real C transport tests
        run: |
          python3 tests/transport_smoke.py
          python3 tests/embedding_headers_smoke.py
  native:
    name: Native Flow compile and HTTP / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-14
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Flow 2.0.0 toolchain
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          ref: v2.0.0
          path: .flow-toolchain
      - name: Install R for real native kernel acceptance
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Expose Flow executable
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.flow-toolchain" >> "$GITHUB_PATH"
      - name: Confirm compiler and build exact checked-out source
        run: |
          flow version
          python3 scripts/verify_native.py --require-r
      - name: Package verified executable
        run: sh scripts/package.sh
      - name: Archive qualified platform build
        uses: actions/upload-artifact@v4
        with:
          name: flowstudio-${{ matrix.target }}
          path: dist/flowstudio-*.tar.gz
          if-no-files-found: error
          retention-days: 30
