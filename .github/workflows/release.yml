name: Publish qualified preview
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'godofecht/FlowStudio'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact qualified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download platform archives produced by CI
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'flowstudio-*'
          merge-multiple: true
          path: dist
      - name: Verify expected archives and package source
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -s "dist/flowstudio-${version}-linux-x86_64.tar.gz"
          test -s "dist/flowstudio-${version}-darwin-arm64.tar.gz"
          git archive --format=tar.gz --prefix="flowstudio-${version}/" \
            -o "dist/flowstudio-v${version}-source.tar.gz" HEAD
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create a GitHub prerelease only after CI passed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Bump VERSION before another release."
            exit 0
          fi
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
            --target "$VERIFIED_SHA" --title "FlowStudio $tag (developer preview)" \
            --notes-file RELEASE_NOTES.md --prerelease
